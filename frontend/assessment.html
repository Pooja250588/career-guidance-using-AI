<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Compass - Assessment</title>
    <!-- DaisyUI and Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      .glowing-bg {
        background: radial-gradient(circle at 10% 20%, #170d38 0%, #060211 75%);
      }
      .blob {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        opacity: 0.3;
        animation: float 13s infinite alternate;
      }
      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-30px, 30px) scale(1.2); }
      }
    </style>
</head>
<body class="glowing-bg min-h-screen flex flex-col justify-between text-white relative overflow-x-hidden">
    <!-- Glowing background blobs -->
    <div class="blob bg-purple-900 top-20 left-10"></div>
    <div class="blob bg-indigo-900 bottom-20 right-10" style="animation-delay: 2s;"></div>

    <nav class="relative z-10 w-full px-6 py-4 flex items-center justify-between bg-black/25 backdrop-blur-md border-b border-white/5">
      <div class="nav__logo">
        <a href="/" class="logo text-2xl font-bold flex items-center gap-2">
          Career<span class="text-[#fa6021]">C🧭mpass</span>
        </a>
      </div>
      <ul class="flex items-center gap-6">
        <li><a href="/" class="hover:text-[#fa6021] transition-all">Home</a></li>
        <li><button class="btn btn-sm btn-ghost hover:bg-[#6a38c2] hover:text-white" onclick="window.location.href='/chatbot.html'">ChatBOT</button></li>
      </ul>
    </nav>

    <!-- Assessment Wizard Container -->
    <div class="flex-grow flex justify-center items-center py-12 relative z-10 px-4">
        <div class="card w-full max-w-xl glass-card rounded-2xl">
            <div class="card-body p-6 sm:p-10">
                <!-- Header and Progress -->
                <div class="mb-8">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[#fa6021] font-bold text-xs uppercase tracking-wider">Aptitude & Aspirations</span>
                        <span id="wizardStep" class="text-xs text-slate-400">Question 1 of 6</span>
                    </div>
                    <div class="w-full bg-white/10 rounded-full h-1.5 overflow-hidden">
                        <div id="wizardProgress" class="bg-gradient-to-r from-[#6a38c2] to-[#fa6021] h-1.5 rounded-full transition-all duration-300" style="width: 16.6%;"></div>
                    </div>
                </div>

                <!-- Active Question area -->
                <div id="questionContainer" class="min-h-[220px]">
                    <!-- Question elements injected dynamically -->
                </div>

                <!-- Navigation Controls -->
                <div class="flex justify-between items-center mt-8 pt-6 border-t border-white/10">
                    <button id="btnPrev" onclick="prevQuestion()" class="btn btn-ghost border border-white/10 hover:bg-white/5 rounded-xl opacity-50 cursor-not-allowed" disabled>
                        <i class="ri-arrow-left-line"></i> Back
                    </button>
                    <button id="btnNext" onclick="nextQuestion()" class="btn btn-primary bg-gradient-to-r from-[#6a38c2] to-[#fa6021] border-none text-white font-bold rounded-xl shadow-lg transition-all flex items-center gap-1">
                        Next <i class="ri-arrow-right-line"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Full-page Loader -->
    <div id="loader" class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-50 hidden">
      <div class="flex flex-col items-center gap-4">
        <span class="loading loading-spinner loading-lg text-[#fa6021]"></span>
        <p class="text-white font-semibold text-sm">Reviewing your answers and tailoring pathways...</p>
      </div>
    </div>

    <footer class="footer bg-black/35 backdrop-blur-md text-slate-400 border-t border-white/5 p-6 relative z-10 flex flex-col sm:flex-row justify-between items-center gap-4">
      <aside class="flex items-center gap-2">
        <a href="#" class="logo text-lg font-bold">Career<span class="text-[#fa6021]">C🧭mpass</span></a>
        <p class="text-xs">| Designed & Developed by Pooja Wanjare</p>
      </aside>
    </footer>

    <script>
        // Predefined structured assessment questions
        const questions = [
            {
                id: 1,
                type: "text",
                question: "What is your favorite subject in school or your academic major in college?",
                placeholder: "E.g., Computer Science, Biology, Business Administration..."
            },
            {
                id: 2,
                type: "text",
                question: "What is your favorite hobby or pastime?",
                placeholder: "E.g., Writing code, photography, public speaking, building electronics..."
            },
            {
                id: 3,
                type: "options",
                question: "If given a choice, how do you prefer to work?",
                options: ["In a Collaborative Team", "Independently / Alone", "Depends on the task"]
            },
            {
                id: 4,
                type: "options",
                question: "Which of these traits best describes you?",
                options: ["Innovative & Creative", "Detail-oriented & Analytical", "Natural Leader & Organizer", "Empathetic & Supportive"]
            },
            {
                id: 5,
                type: "options",
                question: "What type of tasks appeal to you the most?",
                options: [
                    "Analyzing data and solving logic puzzles",
                    "Designing or building physical/digital products",
                    "Helping/advising others and tackling social issues",
                    "Managing projects and making commercial decisions"
                ]
            },
            {
                id: 6,
                type: "text",
                question: "Where do you see yourself professionally in the next 5 years?",
                placeholder: "E.g., Running my own startup, working as a senior designer, researching biotech..."
            }
        ];

        let currentIdx = 0;
        const answers = {};

        document.addEventListener('DOMContentLoaded', () => {
            renderQuestion();
        });

        function renderQuestion() {
            const questionContainer = document.getElementById('questionContainer');
            const questionData = questions[currentIdx];
            
            // Update step text and progress bar
            document.getElementById('wizardStep').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
            const percentage = ((currentIdx + 1) / questions.length) * 100;
            document.getElementById('wizardProgress').style.width = `${percentage}%`;

            // Setup buttons
            const btnPrev = document.getElementById('btnPrev');
            if (currentIdx === 0) {
                btnPrev.classList.add('opacity-50', 'cursor-not-allowed');
                btnPrev.disabled = true;
            } else {
                btnPrev.classList.remove('opacity-50', 'cursor-not-allowed');
                btnPrev.disabled = false;
            }

            const btnNext = document.getElementById('btnNext');
            if (currentIdx === questions.length - 1) {
                btnNext.innerHTML = 'Submit <i class="ri-check-line"></i>';
            } else {
                btnNext.innerHTML = 'Next <i class="ri-arrow-right-line"></i>';
            }

            // Render details
            let html = `<h3 class="text-xl font-semibold mb-6 text-white leading-relaxed">${questionData.question}</h3>`;

            if (questionData.type === "text") {
                const prevVal = answers[questionData.id] || "";
                html += `
                    <textarea 
                        id="answerText"
                        rows="4" 
                        class="textarea textarea-bordered w-full bg-black/30 border-white/10 text-white focus:border-[#6a38c2] focus:ring-1 focus:ring-[#6a38c2] placeholder:text-slate-600 rounded-xl"
                        placeholder="${questionData.placeholder}"
                    >${prevVal}</textarea>
                `;
            } else if (questionData.type === "options") {
                const selectedVal = answers[questionData.id] || "";
                html += `<div class="flex flex-col gap-3">`;
                questionData.options.forEach(option => {
                    const isSelected = selectedVal === option;
                    const activeClasses = isSelected 
                        ? 'border-[#fa6021] bg-[#fa6021]/10 text-white' 
                        : 'border-white/10 hover:border-white/20 bg-white/5 text-slate-300 hover:text-white';
                    html += `
                        <button 
                            onclick="selectOption('${option}')"
                            class="border px-5 py-4 rounded-xl text-left font-medium transition-all ${activeClasses} flex items-center justify-between"
                        >
                            <span>${option}</span>
                            ${isSelected ? '<i class="ri-checkbox-circle-fill text-[#fa6021]"></i>' : '<i class="ri-checkbox-blank-circle-line text-slate-500"></i>'}
                        </button>
                    `;
                });
                html += `</div>`;
            }

            questionContainer.innerHTML = html;
            
            // Focus textarea if it exists
            const answerText = document.getElementById('answerText');
            if (answerText) answerText.focus();
        }

        function selectOption(val) {
            const q = questions[currentIdx];
            answers[q.id] = val;
            
            // Re-render to show selected checkmark
            renderQuestion();
            
            // Auto-advance for options questions to make it feel smooth
            setTimeout(() => {
                nextQuestion();
            }, 300);
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                // If text type, save current input before moving back
                const answerText = document.getElementById('answerText');
                if (answerText) {
                    answers[questions[currentIdx].id] = answerText.value;
                }
                currentIdx--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            // Save value
            const q = questions[currentIdx];
            if (q.type === "text") {
                const answerText = document.getElementById('answerText');
                if (answerText) {
                    answers[q.id] = answerText.value.trim();
                }
            }

            // Check if current question is answered (text questions can be optional, but options should be selected)
            if (q.type === "options" && !answers[q.id]) {
                alert("Please select one of the options to continue.");
                return;
            }

            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                submitAssessment();
            }
        }

        function submitAssessment() {
            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');

            const formattedAnswers = questions.map(q => {
                return {
                    question: q.question,
                    answer: answers[q.id] || "No answer provided"
                };
            });

            const sessionId = sessionStorage.getItem('session_id') || 'default';

            fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `These are the answers submitted by the user in the career assessment:\n\n${JSON.stringify(formattedAnswers, null, 2)}`,
                    context: "You are a career counselor reviewing the user's answers to formulate personalized career recommendations and match levels.",
                    is_context_setting: true,
                    chat_mode: false,
                    session_id: sessionId
                })
            }).then(response => {
                if (!response.ok) throw new Error("Failed to save answers");
                loader.classList.add('hidden');
                window.location.href = 'results.html';
            }).catch(error => {
                console.error(error);
                loader.classList.add('hidden');
                alert('An error occurred during submission. Please try again.');
            });
        }
    </script>
</body>
</html>
